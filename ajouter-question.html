<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ajouter une question</title>
</head>
<body>
  <h1>Ajouter une question à un examen</h1>
  <form id="form-question">
    <label for="proprietaire">Nom du propriétaire :</label>
    <input type="text" id="proprietaire" name="proprietaire" placeholder="Ex: Prof. Dupont" required>
    <br>
    <label for="nom-examen">Nom de l'examen :</label>
    <input type="text" id="nom-examen" name="nom-examen" placeholder="Ex: Examen JavaScript" required>
    <br>
    <label for="enonce">Énoncé de la question :</label>
    <textarea id="enonce" name="enonce" placeholder="Écrivez la question ici..." required></textarea>
    <br>
    <label for="duree">Durée (en secondes) :</label>
    <input type="number" id="duree" name="duree" placeholder="Ex: 60" required>
    <br>
    <label for="points">Points :</label>
    <input type="number" id="points" name="points" placeholder="Ex: 5" required>
    <br>
    <div id="propositions"></div>
    <button type="button" id="add-proposition">+ Ajouter une proposition</button>
    <br><br>
    <button type="submit">Ajouter la question</button>
  </form>
  <script src="ajouter-question.js"></script>
</body>
</html>
